<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open-Meteo Forecast API: reference (sample documentation)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui.css">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .intro { max-width: 1460px; margin: 0 auto; padding: 20px 20px 0; color: #3b4151; }
    .intro p { margin: 0 0 8px; line-height: 1.5; }
    .intro a { color: #157878; }
  </style>
</head>
<body>
  <div class="intro">
    <p><strong>Independent portfolio sample.</strong> Written for the public Open-Meteo Forecast API. It is not official Open-Meteo documentation. Last verified on 11 October 2026.</p>
    <p>New to the API? Start with the <a href="quickstart.html">Quickstart</a>. Use “Try it out” below to send live requests.</p>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        docExpansion: "list",
        supportedSubmitMethods: ["get"]
      });
    };
  </script>
</body>
</html>
